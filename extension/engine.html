<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Voz EN</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 14px; background: #14161a; color: #e8eaed; font-size: 14px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; background: #2f6feb; color: #fff; }
  button.stop { background: #c93c3c; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  select, input[type=range] { font: inherit; }
  .status { font-size: 12px; line-height: 1.7; color: #9aa0a6; }
  .status b { color: #e8eaed; font-weight: 600; }
  .ok { color: #5fd18b; } .warn { color: #e6b450; }
  #live { min-height: 38px; margin: 10px 0; padding: 8px 10px; background: #1d2026; border-radius: 8px; color: #9aa0a6; font-style: italic; }
  #log { height: 300px; overflow-y: auto; background: #1d2026; border-radius: 8px; padding: 8px 10px; }
  #log div { margin-bottom: 8px; }
  #log .es { color: #9aa0a6; font-size: 12px; }
  #dbg { margin-top: 12px; font-size: 12px; }
  #dbg summary { cursor: pointer; font-weight: 600; margin-bottom: 6px; }
  #dbg button { padding: 5px 10px; font-size: 12px; background: #3a3f48; }
  #dbg-summary { color: #5fd18b; margin: 6px 0; line-height: 1.5; }
  #dbg table { width: 100%; border-collapse: collapse; }
  #dbg th, #dbg td { text-align: right; padding: 3px 5px; border-bottom: 1px solid #262a31; white-space: nowrap; }
  #dbg th:first-child, #dbg td.t { text-align: left; white-space: normal; }
  #dbg td.t span { color: #8ab4f8; }
  #dbg-events { height: 140px; overflow: auto; background: #101216; border-radius: 8px; padding: 6px 8px; margin: 8px 0 0; font-size: 11px; color: #9aa0a6; }
  .cfg label { display: flex; align-items: center; gap: 6px; }
  #log .en { color: #e8eaed; }
</style>
</head>
<body>
<h1>Voz EN · español → inglés en la reunión</h1>
<div class="row">
  <button id="toggle">Empezar</button>
  <label>Voz <select id="voice">
    <option value="am_michael">Hombre (Michael)</option>
    <option value="am_adam">Hombre (Adam)</option>
    <option value="bm_george">Hombre (George, UK)</option>
    <option value="af_heart">Mujer (Heart)</option>
    <option value="af_bella">Mujer (Bella)</option>
    <option value="bf_emma">Mujer (Emma, UK)</option>
  </select></label>
</div>
<div class="row">
  <label>Velocidad <input id="speed" type="range" min="0.9" max="1.4" step="0.05" value="1.1"></label>
  <label><input id="monitor" type="checkbox"> Oír el inglés yo también</label>
</div>
<div class="status" id="status"></div>
<div id="live">…</div>
<details id="dbg" open>
  <summary>Debug (tiempos en ms)</summary>
  <div class="row cfg">
    <label>Pausa para cortar <input id="cfg-pause" type="range" min="150" max="1500" step="50"> <b id="cfg-pause-v"></b> ms</label>
    <label>Máx. palabras <input id="cfg-maxwords" type="range" min="5" max="30" step="1"> <b id="cfg-maxwords-v"></b></label>
    <label>Mín. palabras <input id="cfg-minwords" type="range" min="1" max="4" step="1"> <b id="cfg-minwords-v"></b></label>
  </div>
  <div class="row"><button id="dbg-copy">Copiar informe</button><button id="dbg-clear">Limpiar</button></div>
  <div id="dbg-summary"></div>
  <div id="dbg-table"></div>
  <pre id="dbg-events"></pre>
</details>
<div id="log"></div>
<script type="module" src="engine.js"></script>
</body>
</html>
